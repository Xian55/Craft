name: Build Craft

# Validation only: PRs and feature branches. Pushes to main go through
# Release.yml, which runs the same tests before publishing.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: System deps (raylib)
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Build
        run: |
          cmake -S . -B ../build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build ../build-native -j"$(nproc)"
      - name: Tests
        run: |
          B=../build-native
          bun tools/terrain_ref.mjs > ref.txt
          "$B/gen_test" > c.txt
          diff ref.txt c.txt          # terrain determinism gate
          "$B/phys_test"
          "$B/sim_test"
          "$B/net_test"
          "$B/craft" --server-test
      - name: E2E (wire spec against craft --server)
        run: |
          mkdir -p ../craft_raylib_build/native
          cp ../build-native/craft ../craft_raylib_build/native/craft
          bun tools/e2e_net.mjs

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja git
      - uses: oven-sh/setup-bun@v2
      - name: Build
        run: |
          cmake -S . -B ../build-native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build ../build-native -j
      - name: Tests
        run: |
          B=../build-native
          bun tools/terrain_ref.mjs > ref.txt
          "$B/gen_test.exe" > c.txt
          diff --strip-trailing-cr ref.txt c.txt
          "$B/phys_test.exe"
          "$B/sim_test.exe"
          "$B/net_test.exe"
          "$B/craft.exe" --server-test
      - name: E2E (wire spec against craft --server)
        run: |
          mkdir -p ../craft_raylib_build/native
          cp ../build-native/craft.exe ../craft_raylib_build/native/craft.exe
          bun tools/e2e_net.mjs

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build (universal arm64 + x86_64)
        run: |
          cmake -S . -B ../build-native -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build ../build-native -j3
      - name: Tests
        run: |
          B=../build-native
          bun tools/terrain_ref.mjs > ref.txt
          "$B/gen_test" > c.txt
          diff ref.txt c.txt
          "$B/phys_test"
          "$B/sim_test"
          "$B/net_test"
          "$B/craft" --server-test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build
        run: |
          emcmake cmake -S . -B ../build-web -DCMAKE_BUILD_TYPE=Release -DPLATFORM=Web
          cmake --build ../build-web -j"$(nproc)"
